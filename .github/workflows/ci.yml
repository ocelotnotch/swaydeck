name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: python3 -m compileall -q src tests

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n legacy/swaydeck.bash

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

      - name: Verify CLI version
        run: test "$(./swaydeck --version)" = "SwayDeck 0.3.2"
