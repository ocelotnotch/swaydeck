[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swaydeck"
version = "0.3.0"
description = "TUI display manager for Sway"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
swaydeck = "swaydeck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
